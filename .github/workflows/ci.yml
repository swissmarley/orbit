name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI never needs credentials: every run uses the MockDriver.
      ORBIT_DRIVER: mock
      ANTHROPIC_API_KEY: ''
      # Type-aware ESLint over the whole monorepo outgrew Node's default heap
      # on the runner (lint died with "heap out of memory" since M3).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  app-e2e:
    name: app · build · storybook · e2e (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORBIT_DRIVER: mock
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orbit/app build
      - run: pnpm --filter @orbit/app build-storybook --quiet
      - run: pnpm --filter @orbit/app exec playwright install --with-deps chromium
      - run: pnpm --filter @orbit/app e2e
      # The Browser plugin's allowlist tests drive a real Chromium (skipped in the check job).
      - run: pnpm vitest run --project @orbit/plugin-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/orbit-app/playwright-report
