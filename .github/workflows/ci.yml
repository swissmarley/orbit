name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI never needs credentials: every run uses the MockDriver.
      ORBIT_DRIVER: mock
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
