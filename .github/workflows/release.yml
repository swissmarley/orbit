name: Release

# A version tag (vX.Y.Z, matching packaging/npm/package.json) runs the full
# check, publishes `orbit-bots` to npm with provenance (only when the
# NPM_TOKEN secret exists), pushes the Docker image to ghcr.io, builds the
# desktop bundles and creates the GitHub Release with the npm tarball, the
# bundles and SHA-256 checksums (ADR-017). Run by hand it is a dry run:
# everything is built and smoke-tested, nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit (the version in a comment): jobs here can
# publish (id-token, packages and contents write).

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: format · lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORBIT_DRIVER: mock
      ANTHROPIC_API_KEY: ''
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag is the package version
        if: env.PUBLISH == 'true'
        run: test "v$(node -p "require('./packaging/npm/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check

  npm:
    name: npm · build · smoke · publish
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      ORBIT_DRIVER: mock
      ANTHROPIC_API_KEY: ''
      # Only whether the secret exists: the token itself is given to the
      # publish step alone, never to `pnpm install` or the smoke test (whose
      # install scripts run with the job's environment).
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Builds the package and installs the packed tarball into a temp prefix.
      - run: pnpm smoke
      - name: Pack the tested build
        run: |
          mkdir -p release
          cd packaging/npm
          npm pack --pack-destination ../../release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: release/*.tgz
          if-no-files-found: error
      - name: Publish to npm
        if: env.PUBLISH == 'true' && env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release/orbit-bots-*.tgz --provenance --access public
      - name: No NPM_TOKEN secret
        if: env.PUBLISH == 'true' && env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN is not set; orbit-bots was not published to npm."

  docker:
    name: docker · ghcr.io
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=sha,enable=${{ env.PUBLISH != 'true' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/orbitd.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: desktop
    needs: check
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read

  github-release:
    name: GitHub Release
    # The desktop bundles are optional (R9): a failed desktop build does not hold the release back.
    needs: [npm, docker, desktop]
    if: always() && needs.npm.result == 'success' && needs.docker.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.desktop.result == 'success'
        with:
          pattern: orbit-desktop-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir -p release/flat
          find release -type f ! -path 'release/flat/*' -exec mv {} release/flat/ \;
          cd release/flat
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/flat/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Orbit $GITHUB_REF_NAME"
      - name: Dry run
        if: env.PUBLISH != 'true'
        run: echo "Dry run; a vX.Y.Z tag would release:" && ls -l release/flat
