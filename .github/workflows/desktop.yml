name: Desktop

# The Tauri desktop shell (ADR-017). Optional and separate from CI (risk R9:
# it needs WebKitGTK on Linux and a Rust toolchain everywhere). Runs by hand,
# and from release.yml for every version tag, which attaches the bundles to
# the GitHub Release. Bundles are not code-signed yet.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: desktop · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            os: windows-latest
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/orbit-desktop/src-tauri -> target
      - name: WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      # Only the Tauri CLI: the shell does not bundle Orbit (it runs the installed `orbit`).
      - run: pnpm install --frozen-lockfile --filter @orbit/desktop
      - name: Unit tests (navigation guard, sign-in link, child environment)
        run: cargo test --locked --manifest-path apps/orbit-desktop/src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/orbit-desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/orbit-desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/orbit-desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/orbit-desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/orbit-desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/orbit-desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/orbit-desktop/src-tauri/target/**/release/bundle/nsis/*.exe
