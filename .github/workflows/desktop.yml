name: Desktop

# The Tauri desktop shell (ADR-017). Optional and separate from CI (risk R9:
# it needs WebKitGTK on Linux and a Rust toolchain everywhere). Runs by hand,
# and from release.yml for every version tag, which attaches the bundles to
# the GitHub Release. Bundles are not code-signed yet.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Actions are pinned to a commit (the version in a comment): these bundles
# are attached to releases.

jobs:
  bundle:
    name: desktop · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            os: windows-latest
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned by commit, the action cannot read the toolchain from its ref.
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/orbit-desktop/src-tauri -> target
      - name: WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      # Only the Tauri CLI: the shell does not bundle Orbit (it runs the installed `orbit`).
      - run: pnpm install --frozen-lockfile --filter @orbit/desktop
      - name: Unit tests (navigation guard, sign-in link, child environment)
        run: cargo test --locked --manifest-path apps/orbit-desktop/src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          projectPath: apps/orbit-desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbit-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/orbit-desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/orbit-desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/orbit-desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/orbit-desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/orbit-desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/orbit-desktop/src-tauri/target/**/release/bundle/nsis/*.exe
