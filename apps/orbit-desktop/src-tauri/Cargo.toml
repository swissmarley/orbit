[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Orbit desktop shell: the App from your local orbitd in its own window"
authors = ["Nakya"]
license = "MIT"
repository = "https://github.com/swissmarley/orbit"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
