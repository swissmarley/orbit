<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Orbit</title>
    <link rel="stylesheet" href="shell.css" />
    <script type="module" src="shell.js"></script>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true">
        <circle cx="16" cy="16" r="5" fill="#6d5ae6" />
        <ellipse
          cx="16"
          cy="16"
          rx="13"
          ry="6"
          fill="none"
          stroke="#6d5ae6"
          stroke-width="2.5"
          transform="rotate(-25 16 16)"
        />
      </svg>
      <h1>Orbit</h1>
      <p id="status" role="status">Starting Orbit…</p>
      <section id="problem" hidden>
        <h2 id="message"></h2>
        <p id="hint"></p>
        <p class="small">Close this window and open Orbit again once it is fixed.</p>
      </section>
    </main>
  </body>
</html>
