# Orbit in Docker (ADR-017): orbitd serves the API and the App from one
# container, in API-key mode (the Claude Code CLI login is never used here).
#
#   # The key goes in a file the container reads as a secret, never in an
#   # environment variable (every process of the container's user could read
#   # orbitd's or PID 1's environment). On Linux the container's orbit user
#   # (uid 10001) must be able to read it; nobody else needs to:
#   install -m 0600 /dev/null ~/.orbit-api-key
#   printf %s 'sk-ant-…' > ~/.orbit-api-key
#   sudo chown 10001 ~/.orbit-api-key      # or: setfacl -m u:10001:r ~/.orbit-api-key
#   ORBIT_API_KEY_SECRET=~/.orbit-api-key docker compose up -d --build
#   docker compose exec orbitd orbit app --no-open   # one-time sign-in link for the App
#   docker compose exec orbitd orbit doctor          # any CLI command works this way
#   docker compose exec orbitd orbit bot create --template inbox-triage
#
# No key at hand? ORBIT_DRIVER=mock docker compose up -d replays recorded
# sessions (without ORBIT_API_KEY_SECRET the secret is empty). A released
# image instead of a local build:
#   ORBIT_IMAGE=ghcr.io/swissmarley/orbit:latest docker compose up -d --no-build
#
# The key is never part of the image or of any process environment: compose
# mounts the file at /run/secrets/anthropic_api_key and orbitd reads it
# (ORBIT_API_KEY_FILE). Instead of a key, ORBIT_API_KEY_HELPER may name a
# command inside the container that prints one (Claude Code's apiKeyHelper),
# e.g. a script you mount read-only.
name: orbit

services:
  orbitd:
    build:
      context: .
      dockerfile: docker/orbitd.Dockerfile
    image: ${ORBIT_IMAGE:-orbit:local}
    restart: unless-stopped
    environment:
      # Listen on the container's interface so the published port reaches it.
      # orbitd accepts a wildcard bind only inside a container
      # (ORBIT_CONTAINER=1 plus the runtime's marker file) and still publishes
      # http://127.0.0.1:7420 to the CLI and the App.
      ORBIT_HOST: 0.0.0.0
      ORBIT_CONTAINER: '1'
      # The API key: the secret below, read from a file by orbitd. Never set
      # ANTHROPIC_API_KEY here: tini (PID 1) and orbitd would hold it in
      # their environment.
      ORBIT_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Passed through from your shell or .env only when set.
      ORBIT_API_KEY_HELPER:
      ORBIT_DRIVER:
      ORBIT_DEFAULT_MODEL:
      ORBIT_TRIAGE_MODEL:
      TZ:
    secrets:
      - anthropic_api_key
    ports:
      # Host loopback only: the API is plain HTTP with a bearer token and the
      # App's session cookie. Never publish it on 0.0.0.0 or a LAN address.
      # Keep both sides 7420: orbitd checks the Host header against its port.
      - '127.0.0.1:7420:7420'
    volumes:
      - orbit-data:/data
      - orbit-home:/home/orbit
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  anthropic_api_key:
    # A bind-mounted file (works with read_only: true). Without
    # ORBIT_API_KEY_SECRET it is /dev/null: an empty secret, no key.
    file: ${ORBIT_API_KEY_SECRET:-/dev/null}

volumes:
  # Orbit's database, vault, workspaces and memory ($ORBIT_HOME).
  orbit-data:
  # The engine's own state ($HOME): session transcripts parked Runs resume from.
  orbit-home:
